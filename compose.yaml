name: ${COMPOSE_PROJECT_NAME:-jenkins-platform}

services:
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
      args:
        JENKINS_IMAGE: ${JENKINS_IMAGE:-jenkins/jenkins:2.568.1-jdk21@sha256:f4f65e6cd1405cd889b7f5ac33f9d5cdc2a099de6b87fe8a3933b9c5d53d1d02}
    image: jenkins-platform/controller:2.568.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JENKINS_HTTP_PORT:-8080}:8080"
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs
      JENKINS_PUBLIC_URL: ${JENKINS_URL:-http://127.0.0.1:8080/}
      JENKINS_LIBRARY_URL: ${JENKINS_LIBRARY_URL:-https://github.com/Swimming1997/YL_Jenkins.git}
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Djava.awt.headless=true
        -Dio.jenkins.plugins.casc.core.HudsonPrivateSecurityRealmConfigurator.exportUsers=false
        -Dcom.michelin.cio.hudson.plugins.rolestrategy.RoleBasedAuthorizationStrategy.useItemAndAgentRoles=true
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./jcasc:/var/jenkins_home/casc_configs:ro
      - ./jobs:/var/jenkins_home/job-dsl:ro
    secrets:
      - jenkins_admin_password
      - jenkins_audit_password
      - xhsmedium_scm_token
      - build_agent_ssh_private_key
      - regression_agent_ssh_private_key
      - release_agent_ssh_private_key
      - deploy_dev_agent_ssh_private_key
      - deploy_test_agent_ssh_private_key
      - registry_username
      - registry_password
      - deploy_dev_mysql_password
      - deploy_dev_jwt_secret
      - deploy_dev_draft_key
      - deploy_test_mysql_password
      - deploy_test_jwt_secret
      - deploy_test_draft_key
    networks:
      - control
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/login >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  build-agent:
    build:
      context: .
      dockerfile: agents/build/Dockerfile
    image: jenkins-platform/build-agent:node20
    restart: unless-stopped
    secrets:
      - build_agent_ssh_public_key
    networks:
      - control
    tmpfs:
      - /home/jenkins/agent:size=2g,uid=1000,gid=1000,mode=0700,exec
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -T 3 -p 22 127.0.0.1 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256

  regression-agent:
    build:
      context: .
      dockerfile: agents/regression/Dockerfile
    image: jenkins-platform/regression-agent:node20-playwright1.59.1
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://regression-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    secrets:
      - regression_agent_ssh_public_key
    volumes:
      - regression_docker_certs:/certs/client:ro
      - regression_workspace:/home/jenkins/agent
    networks:
      - control
      - regression_docker
    depends_on:
      regression-docker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -T 3 -p 22 127.0.0.1 >/dev/null 2>&1 && docker info >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256

  regression-docker:
    image: docker:29.3.1-dind@sha256:686d2c5464787b0ca42420e0aa03a94fc9781ff9bf8b5ff947614b9fa4c3c3e0
    hostname: regression-docker
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - regression_docker_certs:/certs/client
      - regression_docker_data:/var/lib/docker
      - regression_workspace:/home/jenkins/agent
    networks:
      - regression_docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 4g
    cpus: 6.0
    pids_limit: 1024

  release-agent:
    build:
      context: .
      dockerfile: agents/release/Dockerfile
    image: jenkins-platform/release-agent:docker29
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://release-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    secrets:
      - release_agent_ssh_public_key
    volumes:
      - release_docker_certs:/certs/client:ro
    networks:
      - control
      - release_docker
    depends_on:
      release-docker:
        condition: service_healthy
    tmpfs:
      - /home/jenkins/agent:size=4g,uid=1000,gid=1000,mode=0700,exec
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -T 3 -p 22 127.0.0.1 >/dev/null 2>&1 && docker info >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256

  release-docker:
    image: docker:29.3.1-dind@sha256:686d2c5464787b0ca42420e0aa03a94fc9781ff9bf8b5ff947614b9fa4c3c3e0
    hostname: release-docker
    restart: unless-stopped
    privileged: true
    command: ["--insecure-registry=registry:5000"]
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - release_docker_certs:/certs/client
      - release_docker_data:/var/lib/docker
    networks:
      - release_docker
      - release_registry
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 4g
    cpus: 6.0
    pids_limit: 1024

  deploy-dev-agent:
    build:
      context: .
      dockerfile: agents/deploy/Dockerfile
    image: jenkins-platform/deploy-agent:docker29
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://deploy-dev-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    secrets:
      - source: deploy_dev_agent_ssh_public_key
        target: deploy_agent_ssh_public_key
    volumes:
      - deploy_dev_docker_certs:/certs/client:ro
    networks:
      - control
      - deploy_dev_docker
    depends_on:
      deploy-dev-docker:
        condition: service_healthy
    tmpfs:
      - /home/jenkins/agent:size=2g,uid=1000,gid=1000,mode=0700,exec
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -T 3 -p 22 127.0.0.1 >/dev/null 2>&1 && docker info >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  deploy-dev-docker:
    image: docker:29.3.1-dind@sha256:686d2c5464787b0ca42420e0aa03a94fc9781ff9bf8b5ff947614b9fa4c3c3e0
    hostname: deploy-dev-docker
    restart: unless-stopped
    privileged: true
    command: ["--insecure-registry=registry:5000"]
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - deploy_dev_docker_certs:/certs/client
      - deploy_dev_docker_data:/var/lib/docker
    networks:
      - deploy_dev_docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 4g
    cpus: 4.0
    pids_limit: 1024

  deploy-test-agent:
    build:
      context: .
      dockerfile: agents/deploy/Dockerfile
    image: jenkins-platform/deploy-agent:docker29
    restart: unless-stopped
    environment:
      DOCKER_HOST: tcp://deploy-test-docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    secrets:
      - source: deploy_test_agent_ssh_public_key
        target: deploy_agent_ssh_public_key
    volumes:
      - deploy_test_docker_certs:/certs/client:ro
    networks:
      - control
      - deploy_test_docker
    depends_on:
      deploy-test-docker:
        condition: service_healthy
    tmpfs:
      - /home/jenkins/agent:size=2g,uid=1000,gid=1000,mode=0700,exec
    healthcheck:
      test: ["CMD-SHELL", "ssh-keyscan -T 3 -p 22 127.0.0.1 >/dev/null 2>&1 && docker info >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

  deploy-test-docker:
    image: docker:29.3.1-dind@sha256:686d2c5464787b0ca42420e0aa03a94fc9781ff9bf8b5ff947614b9fa4c3c3e0
    hostname: deploy-test-docker
    restart: unless-stopped
    privileged: true
    command: ["--insecure-registry=registry:5000"]
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - deploy_test_docker_certs:/certs/client
      - deploy_test_docker_data:/var/lib/docker
    networks:
      - deploy_test_docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    mem_limit: 4g
    cpus: 4.0
    pids_limit: 1024

  registry-auth-init:
    image: httpd:2.4-alpine@sha256:1b766f17b84026429b7cb243317b142921b24432336e798bc881c43f45ed9567
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        username=$$(cat /run/secrets/registry_username)
        password=$$(cat /run/secrets/registry_password)
        htpasswd -Bbn "$$username" "$$password" > /auth/htpasswd
        chmod 600 /auth/htpasswd
    secrets:
      - registry_username
      - registry_password
    volumes:
      - registry_auth:/auth
    networks:
      - release_registry

  registry:
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    restart: unless-stopped
    depends_on:
      registry-auth-init:
        condition: service_completed_successfully
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: XHSMedium Local Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "false"
    ports:
      - "127.0.0.1:${REGISTRY_HTTP_PORT:-5000}:5000"
    volumes:
      - registry_data:/var/lib/registry
      - registry_auth:/auth:ro
    networks:
      - release_registry
      - release_docker
      - deploy_dev_docker
      - deploy_test_docker
    healthcheck:
      test: ["CMD-SHELL", "test -s /auth/htpasswd && nc -z 127.0.0.1 5000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256

volumes:
  jenkins_home:
    name: ${JENKINS_VOLUME_NAME:-jenkins_platform_home}
  regression_docker_certs:
    name: ${REGRESSION_DOCKER_CERTS_VOLUME:-jenkins_platform_regression_docker_certs}
  regression_docker_data:
    name: ${REGRESSION_DOCKER_DATA_VOLUME:-jenkins_platform_regression_docker_data}
  regression_workspace:
    name: ${REGRESSION_WORKSPACE_VOLUME:-jenkins_platform_regression_workspace}
  release_docker_certs:
    name: ${RELEASE_DOCKER_CERTS_VOLUME:-jenkins_platform_release_docker_certs}
  release_docker_data:
    name: ${RELEASE_DOCKER_DATA_VOLUME:-jenkins_platform_release_docker_data}
  deploy_dev_docker_certs:
    name: ${DEPLOY_DEV_DOCKER_CERTS_VOLUME:-jenkins_platform_deploy_dev_docker_certs}
  deploy_dev_docker_data:
    name: ${DEPLOY_DEV_DOCKER_DATA_VOLUME:-jenkins_platform_deploy_dev_docker_data}
  deploy_test_docker_certs:
    name: ${DEPLOY_TEST_DOCKER_CERTS_VOLUME:-jenkins_platform_deploy_test_docker_certs}
  deploy_test_docker_data:
    name: ${DEPLOY_TEST_DOCKER_DATA_VOLUME:-jenkins_platform_deploy_test_docker_data}
  registry_data:
    name: ${REGISTRY_DATA_VOLUME:-jenkins_platform_registry_data}
  registry_auth:
    name: ${REGISTRY_AUTH_VOLUME:-jenkins_platform_registry_auth}

networks:
  control:
    name: ${CONTROL_NETWORK_NAME:-jenkins_platform_control}
  regression_docker:
    name: ${REGRESSION_DOCKER_NETWORK_NAME:-jenkins_platform_regression_docker}
    internal: true
  release_docker:
    name: ${RELEASE_DOCKER_NETWORK_NAME:-jenkins_platform_release_docker}
  release_registry:
    name: ${RELEASE_REGISTRY_NETWORK_NAME:-jenkins_platform_release_registry}
    internal: true
  deploy_dev_docker:
    name: ${DEPLOY_DEV_DOCKER_NETWORK_NAME:-jenkins_platform_deploy_dev_docker}
  deploy_test_docker:
    name: ${DEPLOY_TEST_DOCKER_NETWORK_NAME:-jenkins_platform_deploy_test_docker}

secrets:
  jenkins_admin_password:
    file: ./.secrets/jenkins_admin_password
  jenkins_audit_password:
    file: ./.secrets/jenkins_audit_password
  xhsmedium_scm_token:
    file: ./.secrets/xhsmedium_scm_token
  build_agent_ssh_private_key:
    file: ./.secrets/build_agent_ssh_key
  build_agent_ssh_public_key:
    file: ./.secrets/build_agent_ssh_key.pub
  regression_agent_ssh_private_key:
    file: ./.secrets/regression_agent_ssh_key
  regression_agent_ssh_public_key:
    file: ./.secrets/regression_agent_ssh_key.pub
  release_agent_ssh_private_key:
    file: ./.secrets/release_agent_ssh_key
  release_agent_ssh_public_key:
    file: ./.secrets/release_agent_ssh_key.pub
  deploy_dev_agent_ssh_private_key:
    file: ./.secrets/deploy_dev_agent_ssh_key
  deploy_dev_agent_ssh_public_key:
    file: ./.secrets/deploy_dev_agent_ssh_key.pub
  deploy_test_agent_ssh_private_key:
    file: ./.secrets/deploy_test_agent_ssh_key
  deploy_test_agent_ssh_public_key:
    file: ./.secrets/deploy_test_agent_ssh_key.pub
  registry_username:
    file: ./.secrets/registry_username
  registry_password:
    file: ./.secrets/registry_password
  deploy_dev_mysql_password:
    file: ./.secrets/deploy_dev_mysql_password
  deploy_dev_jwt_secret:
    file: ./.secrets/deploy_dev_jwt_secret
  deploy_dev_draft_key:
    file: ./.secrets/deploy_dev_draft_key
  deploy_test_mysql_password:
    file: ./.secrets/deploy_test_mysql_password
  deploy_test_jwt_secret:
    file: ./.secrets/deploy_test_jwt_secret
  deploy_test_draft_key:
    file: ./.secrets/deploy_test_draft_key
