jenkins:
  systemMessage: |-
    Jenkins Platform
    Managed by Jenkins Configuration as Code. Manual configuration may be overwritten.
  numExecutors: 0
  mode: EXCLUSIVE
  scmCheckoutRetryCount: 2
  slaveAgentPort: -1
  disableRememberMe: true
  globalNodeProperties:
    - envVars:
        env:
          - key: "PAPER_SERVER_RESOURCE_MODE"
            value: "${PAPER_SERVER_RESOURCE_MODE}"

unclassified:
  location:
    adminAddress: "jenkins-admin@localhost.invalid"
    url: "${JENKINS_PUBLIC_URL}"
