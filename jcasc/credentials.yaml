credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "build-agent-ssh"
              description: "Local Docker Build Agent SSH key"
              username: "jenkins"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/build_agent_ssh_private_key}"
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "regression-agent-ssh"
              description: "Local Docker Regression Agent SSH key"
              username: "jenkins"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/regression_agent_ssh_private_key}"
          - usernamePassword:
              scope: GLOBAL
              id: "xhsmedium-scm-readonly"
              description: "Read-only HTTPS token for MuFannnn/xhsmedium"
              username: "x-access-token"
              password: "${trim:${readFile:/run/secrets/xhsmedium_scm_token}}"
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "release-agent-ssh"
              description: "Local Docker Release Agent SSH key"
              username: "jenkins"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/release_agent_ssh_private_key}"
          - usernamePassword:
              scope: GLOBAL
              id: "registry-xhsmedium-push"
              description: "Local authenticated XHSMedium Registry"
              username: "${trim:${readFile:/run/secrets/registry_username}}"
              password: "${trim:${readFile:/run/secrets/registry_password}}"
          - usernamePassword:
              scope: GLOBAL
              id: "jenkins-audit-api"
              description: "Read-only Jenkins API credential for Release gates"
              username: "audit"
              password: "${trim:${readFile:/run/secrets/jenkins_audit_password}}"
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "deploy-dev-agent-ssh"
              description: "Local Docker Dev Deploy Agent SSH key"
              username: "jenkins"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy_dev_agent_ssh_private_key}"
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "deploy-test-agent-ssh"
              description: "Local Docker Test Deploy Agent SSH key"
              username: "jenkins"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/deploy_test_agent_ssh_private_key}"
          - string:
              scope: GLOBAL
              id: "xhsmedium-dev-mysql-password"
              description: "Local simulated XHSMedium dev MySQL password"
              secret: "${trim:${readFile:/run/secrets/deploy_dev_mysql_password}}"
          - string:
              scope: GLOBAL
              id: "xhsmedium-dev-jwt-secret"
              description: "Local simulated XHSMedium dev JWT secret"
              secret: "${trim:${readFile:/run/secrets/deploy_dev_jwt_secret}}"
          - string:
              scope: GLOBAL
              id: "xhsmedium-dev-draft-key"
              description: "Local simulated XHSMedium dev draft encryption key"
              secret: "${trim:${readFile:/run/secrets/deploy_dev_draft_key}}"
          - string:
              scope: GLOBAL
              id: "xhsmedium-test-mysql-password"
              description: "Local simulated XHSMedium test MySQL password"
              secret: "${trim:${readFile:/run/secrets/deploy_test_mysql_password}}"
          - string:
              scope: GLOBAL
              id: "xhsmedium-test-jwt-secret"
              description: "Local simulated XHSMedium test JWT secret"
              secret: "${trim:${readFile:/run/secrets/deploy_test_jwt_secret}}"
          - string:
              scope: GLOBAL
              id: "xhsmedium-test-draft-key"
              description: "Local simulated XHSMedium test draft encryption key"
              secret: "${trim:${readFile:/run/secrets/deploy_test_draft_key}}"
