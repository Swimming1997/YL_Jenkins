jenkins:
  nodes:
    - permanent:
        name: "build-agent"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "linux node20 xhsmedium-build"
        launcher:
          ssh:
            host: "build-agent"
            port: 22
            credentialsId: "build-agent-ssh"
            javaPath: "/opt/java/openjdk/bin/java"
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 10
            sshHostKeyVerificationStrategy:
              nonVerifyingKeyVerificationStrategy: {}
        retentionStrategy: "always"
    - permanent:
        name: "regression-agent"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "linux node20 docker-isolated xhsmedium-regression"
        nodeProperties:
          - envVars:
              env:
                - key: "DOCKER_HOST"
                  value: "tcp://regression-docker:2376"
                - key: "DOCKER_TLS_VERIFY"
                  value: "1"
                - key: "DOCKER_CERT_PATH"
                  value: "/certs/client"
        launcher:
          ssh:
            host: "regression-agent"
            port: 22
            credentialsId: "regression-agent-ssh"
            javaPath: "/usr/bin/java"
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 10
            sshHostKeyVerificationStrategy:
              nonVerifyingKeyVerificationStrategy: {}
        retentionStrategy: "always"
    - permanent:
        name: "release-agent"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "linux docker-isolated xhsmedium-release"
        nodeProperties:
          - envVars:
              env:
                - key: "DOCKER_HOST"
                  value: "tcp://release-docker:2376"
                - key: "DOCKER_TLS_VERIFY"
                  value: "1"
                - key: "DOCKER_CERT_PATH"
                  value: "/certs/client"
                - key: "LOCAL_REGISTRY"
                  value: "registry:5000"
        launcher:
          ssh:
            host: "release-agent"
            port: 22
            credentialsId: "release-agent-ssh"
            javaPath: "/opt/java/openjdk/bin/java"
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 10
            sshHostKeyVerificationStrategy:
              nonVerifyingKeyVerificationStrategy: {}
        retentionStrategy: "always"
    - permanent:
        name: "deploy-dev-agent"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "linux docker-isolated xhsmedium-deploy-dev"
        nodeProperties:
          - envVars:
              env:
                - key: "DOCKER_HOST"
                  value: "tcp://deploy-dev-docker:2376"
                - key: "DOCKER_TLS_VERIFY"
                  value: "1"
                - key: "DOCKER_CERT_PATH"
                  value: "/certs/client"
                - key: "LOCAL_REGISTRY"
                  value: "registry:5000"
                - key: "DEPLOY_ENVIRONMENT"
                  value: "dev"
        launcher:
          ssh:
            host: "deploy-dev-agent"
            port: 22
            credentialsId: "deploy-dev-agent-ssh"
            javaPath: "/opt/java/openjdk/bin/java"
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 10
            sshHostKeyVerificationStrategy:
              nonVerifyingKeyVerificationStrategy: {}
        retentionStrategy: "always"
    - permanent:
        name: "deploy-test-agent"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        mode: EXCLUSIVE
        labelString: "linux docker-isolated xhsmedium-deploy-test"
        nodeProperties:
          - envVars:
              env:
                - key: "DOCKER_HOST"
                  value: "tcp://deploy-test-docker:2376"
                - key: "DOCKER_TLS_VERIFY"
                  value: "1"
                - key: "DOCKER_CERT_PATH"
                  value: "/certs/client"
                - key: "LOCAL_REGISTRY"
                  value: "registry:5000"
                - key: "DEPLOY_ENVIRONMENT"
                  value: "test"
        launcher:
          ssh:
            host: "deploy-test-agent"
